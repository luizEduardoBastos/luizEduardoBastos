name: Update YouTube Music Card

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install colorthief firebase-admin Pillow python-dotenv requests ytmusicapi

      - name: Run update script
        env:
          YTMUSIC_BROWSER_JSON:      ${{ secrets.YTMUSIC_BROWSER_JSON }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          FIREBASE_BUCKET:           ${{ secrets.FIREBASE_BUCKET }}
        run: python update_card.py

      - name: Increment cache-buster in README
        id: bump
        run: |
          current=$(grep -oP '(?<=alt=media&v=)\d+' README.md 2>/dev/null || echo "0")
          new=$((current + 1))
          sed -i "s/alt=media&v=${current}/alt=media\&v=${new}/" README.md
          echo "new_version=${new}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: bump SVG cache-buster to v${{ steps.bump.outputs.new_version }}"
          git push